name: Sync AOSP Kernel Common

on:
  workflow_dispatch:   # allow manual trigger
  schedule:
    - cron: "0 3 * * *"  # runs daily at 03:00 UTC (optional)

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout your repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Add AOSP remote
        run: |
          git remote add aosp https://android.googlesource.com/kernel/common
          git fetch aosp

      - name: Merge AOSP main into current branch
        run: |
          git checkout main
          git merge aosp/android-mainline --allow-unrelated-histories -m "Sync from AOSP common"

      - name: Push changes
        run: |
          git push origin main
