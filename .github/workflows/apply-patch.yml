name: Apply ACK 4.19 -> 6.12 Patch (merging branch)

on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create merging branch
        run: |
          git checkout -b merging

      - name: Download artifact from run
        uses: actions/download-artifact@v4
        with:
          name: linux419_vs_android16_6_12
          run-id: 22210549878
          path: .

      - name: Unzip artifact
        run: unzip linux419_vs_android16_6_12.zip

      - name: Apply patch
        run: |
          git apply --reject --whitespace=fix ack_4.19_to_6.12.patch || true

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "Apply ACK 4.19 -> Android16 6.12 patch" || echo "Nothing to commit"

      - name: Push merging branch
        run: git push origin merging
