name: Sync AOSP Kernel Common

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout your repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Add AOSP common kernel remote
        run: |
          git remote add aosp-common https://android.googlesource.com/kernel/common
          git fetch aosp-common

      - name: Fetch specific tag
        run: |
          git fetch aosp-common refs/tags/android16-6.12-2025-12_r22:refs/remotes/aosp-common/android16-6.12-2025-12_r22

      - name: Merge AOSP tag into main
        run: |
          git checkout main
          git merge aosp-common/android16-6.12-2025-12_r22 --no-ff -m "Sync AOSP common kernel android16-6.12-2025-12_r22"

      - name: Push to GitHub
        run: |
          git push origin main
